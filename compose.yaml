version: '3.8'

services:
  # PostgreSQL Services
  booking-db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpass
    volumes:
      - booking_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hotel_network

  hotel-db:
    image: postgres:16
    container_name: hotel-db
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hoteluser
      POSTGRES_PASSWORD: hotelpass
    volumes:
      - hotel_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoteluser -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hotel_network

  # Spring Boot Services
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://booking-db:5432/booking_db
      - SPRING_DATASOURCE_USERNAME=bookinguser
      - SPRING_DATASOURCE_PASSWORD=bookingpass
    networks:
      - hotel_network
    depends_on:
      booking-db:
        condition: service_healthy

  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    container_name: hotel-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://hotel-db:5432/hotel_db
      - SPRING_DATASOURCE_USERNAME=hoteluser
      - SPRING_DATASOURCE_PASSWORD=hotelpass
      - JWT_SECRET=hotel-booking-jwt-secret-2026-very-long-key
      - INTERNAL_API_SECRET=hotel-internal-secret-2026
    networks:
      - hotel_network
    depends_on:
      hotel-db:
        condition: service_healthy
      discovery-server:
        condition: service_started

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://booking-db:5432/booking_db
      - SPRING_DATASOURCE_USERNAME=bookinguser
      - SPRING_DATASOURCE_PASSWORD=bookingpass
      - HOTEL_SERVICE_URL=http://hotel-service:8081
      - JWT_SECRET=hotel-booking-jwt-secret-2026-very-long-key
      - INTERNAL_API_SECRET=hotel-internal-secret-2026
    networks:
      - hotel_network
    depends_on:
      booking-db:
        condition: service_healthy
      hotel-service:
        condition: service_started
      discovery-server:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - HOTEL_SERVICE_URL=http://hotel-service:8081
      - BOOKING_SERVICE_URL=http://booking-service:8082
    networks:
      - hotel_network
    depends_on:
      discovery-server:
        condition: service_started
      hotel-service:
        condition: service_started
      booking-service:
        condition: service_started

volumes:
  booking_db_data:
  hotel_db_data:

networks:
  hotel_network:
    driver: bridge